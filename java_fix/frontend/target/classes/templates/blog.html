<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Bài viết</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main><div class="section-title"><div><p class="eyebrow">FASHION JOURNAL</p><h1>Bài viết</h1></div></div><div class="post-grid"><article th:each="post:${posts}"><img th:src="${post.thumbnail}" alt=""><p th:text="${post.category_name}"></p><h3><a th:href="@{/blog/{slug}(slug=${post.slug})}" th:text="${post.title}"></a></h3><p th:text="${post.summary}"></p></article></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
