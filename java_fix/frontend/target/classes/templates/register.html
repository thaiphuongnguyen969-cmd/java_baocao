<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Đăng ký</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth-page"><form class="auth-card" method="post" autocomplete="on"><a class="brand" href="/">FASHION<span>SHOP</span></a><h1>Tạo tài khoản</h1><div th:if="${error}" class="alert" th:text="${error}"></div><label>Họ tên<input name="fullname" autocomplete="name" required></label><label>Email hoặc tài khoản<input type="text" name="email" autocomplete="username" required></label><label>Số điện thoại<input name="phone" autocomplete="tel"></label><label>Mật khẩu<input type="password" name="password" minlength="6" autocomplete="new-password" required></label><label>Địa chỉ<textarea name="address" autocomplete="street-address"></textarea></label><button class="btn full">Đăng ký</button></form></main></body></html>
