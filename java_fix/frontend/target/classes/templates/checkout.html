<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Thanh toán</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header}"></div><main><h1>Thông tin thanh toán</h1><div th:if="${error}" class="alert" th:text="${error}"></div><div class="checkout-grid"><form method="post" class="form-card"><label>Họ tên người nhận<input name="receiverName" required></label><label>Số điện thoại<input name="receiverPhone" required></label><label>Địa chỉ<textarea name="receiverAddress" required></textarea></label><label>Mã giảm giá<input name="couponCode" placeholder="WELCOME10"></label><label>Thanh toán<select name="paymentMethod"><option>COD</option><option>VNPAY</option><option>MOMO</option><option>BANK_TRANSFER</option></select></label><label>Ghi chú<textarea name="note"></textarea></label><button class="btn full">Xác nhận đặt hàng</button></form><aside class="summary"><h2>Giỏ hàng</h2><p th:each="i:${items}" th:text="${i.product_name+' x '+i.quantity}"></p></aside></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
