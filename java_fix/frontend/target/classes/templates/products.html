<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Sản phẩm | FashionShop</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header}"></div><main><div class="section-title"><div><p class="eyebrow">BỘ SƯU TẬP</p><h1>Tất cả sản phẩm</h1></div></div>
<div class="toolbar"><form><input name="search" placeholder="Tìm sản phẩm..."><button class="btn">Tìm kiếm</button></form><select onchange="location.href='/products?categoryId='+this.value"><option value="">Tất cả danh mục</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></div>
<div class="product-grid"><article class="product-card" th:each="p:${products}"><a th:href="@{/products/{id}(id=${p.id})}"><img th:src="${p.thumbnail}" alt=""><h3 th:text="${p.name}"></h3><p class="price" th:text="${#numbers.formatDecimal(p.sale_price != null ? p.sale_price : p.min_price,0,'POINT',0,'COMMA')} + ' đ'"></p></a></article></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
