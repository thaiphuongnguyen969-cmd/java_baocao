<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Tra cứu đơn hàng</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main class="auth-page"><form class="auth-card" method="post"><h1>Tra cứu đơn hàng</h1><div th:if="${error}" class="alert" th:text="${error}"></div><label>Mã đơn hàng<input name="code" placeholder="FS-1001" required></label><button class="btn full">Tra cứu</button></form><div th:if="${order}" class="summary"><h2 th:text="${order.order_code}"></h2><p>Trạng thái: <b th:text="${order.order_status}"></b></p><p>Tổng tiền: <b th:text="${order.final_amount}+' đ'"></b></p></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
