<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Giỏ hàng</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header}"></div><main><h1>Giỏ hàng của bạn</h1><div class="cart-layout"><table><thead><tr><th>Sản phẩm</th><th>Size/Màu</th><th>Giá</th><th>Số lượng</th><th></th></tr></thead><tbody><tr th:each="i:${items}"><td><img class="thumb" th:src="${i.thumbnail}"><b th:text="${i.product_name}"></b></td><td th:text="${i.size+' / '+i.color}"></td><td th:text="${#numbers.formatDecimal(i.sale_price != null ? i.sale_price : i.price,0,'POINT',0,'COMMA')}+' đ'"></td><td th:text="${i.quantity}"></td><td><form th:action="@{/cart/remove/{id}(id=${i.id})}" method="post"><button class="link-button">Xóa</button></form></td></tr></tbody></table><aside class="summary"><h2>Tóm tắt</h2><p>Miễn phí vận chuyển từ 500.000đ</p><a class="btn full" href="/checkout">Thanh toán</a></aside></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
