<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Quản trị</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="admin-layout"><aside><a class="brand light" href="/">FASHION<span>SHOP</span></a><nav><a class="active" href="/admin">Tổng quan</a><a href="/admin/products">Sản phẩm</a><a href="/admin/variants">Biến thể</a><a href="/admin/categories">Danh mục</a><a href="/admin/users">Người dùng</a><a href="/admin/orders">Đơn hàng</a><a href="/admin/coupons">Mã giảm giá</a><a href="/admin/posts">Bài viết</a><a href="/admin/post-categories">Danh mục bài viết</a><a href="/admin/post-comments">Bình luận bài viết</a><a href="/admin/reviews">Đánh giá</a></nav></aside><main><h1>Tổng quan hệ thống</h1><div class="stat-grid"><article><span>Sản phẩm</span><b th:text="${dashboard.products}"></b></article><article><span>Người dùng</span><b th:text="${dashboard.users}"></b></article><article><span>Đơn hàng</span><b th:text="${dashboard.orders}"></b></article><article><span>Doanh thu</span><b th:text="${dashboard.revenue}"></b></article></div><h2>Sản phẩm sắp hết hàng</h2><table><thead><tr><th>Sản phẩm</th><th>SKU</th><th>Tồn kho</th></tr></thead><tbody><tr th:each="v:${dashboard.lowStock}"><td th:text="${v.name}"></td><td th:text="${v.sku}"></td><td th:text="${v.stock}"></td></tr></tbody></table></main></div></body></html>
