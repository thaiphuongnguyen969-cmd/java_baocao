<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title th:text="${product.name}">Sản phẩm</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: header}"></div><main><div class="product-detail">
<img th:src="${product.thumbnail}" alt=""><div><p class="eyebrow" th:text="${product.category_name}"></p><h1 th:text="${product.name}"></h1><p th:text="${product.description}"></p>
<form action="/cart/add" method="post"><select name="variantId"><option th:each="v:${product.variants}" th:value="${v.id}" th:text="${v.size+' / '+v.color+' - '+v.stock+' sản phẩm'}"></option></select><input type="number" name="quantity" min="1" value="1"><button class="btn">Thêm vào giỏ hàng</button></form>
<section class="reviews"><h2>Đánh giá</h2><article th:each="r:${product.reviews}"><b th:text="${r.fullname}"></b><span th:text="${r.rating+' ★'}"></span><p th:text="${r.comment}"></p></article></section></div></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
