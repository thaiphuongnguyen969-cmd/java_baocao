<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title th:text="${post.title}">Bài viết</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: header}"></div><main class="article"><img th:src="${post.thumbnail}" alt=""><p class="eyebrow" th:text="${post.category_name}"></p><h1 th:text="${post.title}"></h1><p th:text="${post.summary}"></p><div class="article-content" th:text="${post.content}"></div><h2>Bình luận</h2><article th:each="c:${post.comments}" class="comment"><b th:text="${c.fullname}"></b><p th:text="${c.content}"></p></article></main><div th:replace="~{fragments :: footer}"></div></body></html>
